services:
  printdash-agent:
    build:
      context: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      PORT: "3003"
      USERS_FILE: /data/users.json
      DATA_FILE: /data/printers.json
      SEAOIL_CONFIG_CACHE_FILE: /data/seaoil-config-cache.json
      SETTINGS_FILE: /data/settings.json
      SCAN_DIR: /opt/scans
      UPLOAD_DIR: /tmp/printdash-uploads
    ports:
      - "${PRINTDASH_BIND_ADDRESS:-127.0.0.1}:${PRINTDASH_PORT:-3003}:3003"
    volumes:
      - printdash-data:/data
      - printdash-scans:/opt/scans
      - /var/run/cups/cups.sock:/var/run/cups/cups.sock
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  printdash-data:
  printdash-scans:
