services:
  db:
    image: postgres:17
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - seaoil_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seaoil_app -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  seaoil_postgres_data:
