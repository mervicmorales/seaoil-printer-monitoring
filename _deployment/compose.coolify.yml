name: seaoil-printer-monitoring

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: seaoil_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seaoil_app -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  db-init:
    image: seaoil-printer-monitoring-db-init:coolify
    pull_policy: never
    build:
      context: ./dashboard
      dockerfile: Dockerfile.migrate
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://seaoil_app:${POSTGRES_PASSWORD}@db:5432/app_db
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        node scripts/migrate-office-naming.mjs &&
        npx drizzle-kit push --config=drizzle.docker.config.ts --force &&
        node scripts/migrate-notifications-registration-smtp.mjs &&
        node scripts/migrate-monitoring-assignments.mjs &&
        node scripts/add-printer-mac-address.mjs &&
        node scripts/add-printer-floor.mjs &&
        node scripts/migrate-auth-security.mjs &&
        node scripts/migrate-mfa.mjs &&
        node scripts/migrate-temporary-password.mjs &&
        node scripts/migrate-repair-ticket-sequence.mjs &&
        node scripts/add-user-printer-permissions.mjs &&
        node scripts/migrate-monitoring-agent-locations.mjs &&
        node scripts/add-printer-access-requests.mjs &&
        node scripts/migrate-organization-data.mjs &&
        node scripts/migrate-office-naming.mjs

  dashboard:
    image: seaoil-printer-monitoring-dashboard:coolify
    pull_policy: never
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=seaoil-printer-monitoring_default"
      - "traefik.http.routers.seaprint-dashboard-http.entrypoints=http"
      - "traefik.http.routers.seaprint-dashboard-http.rule=Host(`seaprint.seaoil.com.ph`)"
      - "traefik.http.routers.seaprint-dashboard-http.service=seaprint-dashboard"
      - "traefik.http.services.seaprint-dashboard.loadbalancer.server.port=3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://seaoil_app:${POSTGRES_PASSWORD}@db:5432/app_db
      AUTH_SECRET: ${AUTH_SECRET}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      MONITORING_STALE_SECONDS: ${MONITORING_STALE_SECONDS:-180}
      AGENT_STATUS_CRON_SECRET: ${AGENT_STATUS_CRON_SECRET}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-printer@seaoil.com.ph}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-SEAOIL Printer}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
    ports:
      - "0.0.0.0:${DASHBOARD_PORT:-3000}:3000"
    volumes:
      - private-uploads:/app/storage/uploads
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:
    external: true
    name: openship-seaoil-printer-monitoring-postgres-data
  private-uploads:
